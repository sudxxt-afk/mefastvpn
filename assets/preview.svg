    <rect x="365" y="86" width="150" height="80" rx="10" fill="#24283b" stroke="#2ca5e0" stroke-width="2"/>
    <text x="440" y="114" text-anchor="middle" fill="#2ca5e0">🤖 bot</text>
    <text x="440" y="136" text-anchor="middle" fill="#565f89">aiogram</text>
